import os
import hmac
import hashlib
from fastapi import FastAPI, Request, HTTPException
from fastapi.responses import JSONResponse

app = FastAPI()

APP_SECRET = os.environ.get("BITLABS_APP_SECRET")

@app.get("/callback")
async def bitlabs_callback(request: Request):
    if not APP_SECRET:
        raise HTTPException(status_code=500, detail="Secreto no configurado")

    # URL completa tal cual llegó (incluye query string)
    url_completa = str(request.url)

    # BitLabs siempre añade &hash=... al final
    if "&hash=" not in url_completa:
        raise HTTPException(status_code=400, detail="Falta el hash")

    url_sin_hash, hash_recibido = url_completa.split("&hash=", 1)

    # HMAC-SHA1 sobre la URL SIN el hash
    firma_esperada = hmac.new(
        APP_SECRET.encode("utf-8"),
        url_sin_hash.encode("utf-8"),
        hashlib.sha1
    ).hexdigest()

    if not hmac.compare_digest(firma_esperada, hash_recibido):
        raise HTTPException(status_code=403, detail="Firma inválida")

    params = request.query_params
    return JSONResponse(
        status_code=200,
        content={
            "status": "ok",
            "uid": params.get("uid"),
            "tx": params.get("tx"),
            "val": params.get("val"),
            "debug": params.get("debug", "false")
        }
    )

@app.get("/")
async def health():
    return {"status": "alive"}
